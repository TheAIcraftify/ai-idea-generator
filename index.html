<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AI Idea Generator - TheAICraftify</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0d10;
      color: #f2f5f7;
      min-height: 100vh;
      line-height: 1.6;
    }

    .container {
      width: min(920px, 92%);
      margin: auto;
    }

    header {
      padding: 22px 0;
      border-bottom: 1px solid #252a31;
    }

    .brand {
      font-size: 22px;
      font-weight: bold;
      color: #ffffff;
    }

    .brand span {
      color: #6ee7ff;
    }

    .hero {
      padding: 55px 0 30px;
      text-align: center;
    }

    .badge {
      display: inline-block;
      padding: 7px 13px;
      border: 1px solid #303943;
      border-radius: 30px;
      color: #6ee7ff;
      font-size: 13px;
      margin-bottom: 18px;
    }

    h1 {
      font-size: clamp(32px, 6vw, 58px);
      line-height: 1.05;
      margin-bottom: 18px;
    }

    .hero p {
      color: #9ba5af;
      max-width: 680px;
      margin: auto;
    }

    .card {
      background: #12161b;
      border: 1px solid #283039;
      border-radius: 18px;
      padding: 25px;
      margin: 25px 0;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .field {
      margin-bottom: 20px;
    }

    input,
    textarea {
      width: 100%;
      background: #0c1014;
      color: #ffffff;
      border: 1px solid #303943;
      border-radius: 10px;
      padding: 14px;
      font-size: 16px;
      outline: none;
    }

    textarea {
      min-height: 105px;
      resize: vertical;
    }

    input:focus,
    textarea:focus {
      border-color: #6ee7ff;
    }

    button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 10px;
      background: #6ee7ff;
      color: #071014;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .loading {
      display: none;
      text-align: center;
      padding: 25px;
      color: #6ee7ff;
    }

    .results {
      display: none;
    }

    .result-title {
      color: #6ee7ff;
      margin-bottom: 10px;
    }

    .solution {
      font-size: 18px;
      color: #e9eef2;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
      margin-top: 20px;
    }

    .result-box {
      background: #0d1115;
      border: 1px solid #283039;
      border-radius: 14px;
      padding: 20px;
    }

    .result-box h3 {
      margin-bottom: 12px;
      color: #ffffff;
    }

    ul,
    ol {
      padding-left: 20px;
      color: #b9c2ca;
    }

    li {
      margin-bottom: 7px;
    }

    .wide {
      grid-column: 1 / -1;
    }

    .secondary {
      margin-top: 12px;
      background: transparent;
      color: #6ee7ff;
      border: 1px solid #303943;
    }

    footer {
      text-align: center;
      padding: 35px 0;
      color: #68727c;
      font-size: 13px;
    }

    @media (max-width: 700px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .wide {
        grid-column: auto;
      }

      .hero {
        padding-top: 35px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="container">
      <div class="brand">
        <span>AI</span>craftify
      </div>
    </div>
  </header>

  <main class="container">

    <section class="hero">
